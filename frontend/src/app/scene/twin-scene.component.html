<div #canvasHost class="canvas-host"></div>

<aside class="hud">
  <h1>Digital Twin</h1>
  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }
  <table>
    <thead>
      <tr><th>Asset</th><th>Temp °C</th><th>Status</th></tr>
    </thead>
    <tbody>
      @for (asset of assets(); track asset.id) {
        <tr>
          <td><span class="swatch" [style.background]="asset.color"></span>{{ asset.name }}</td>
          <td>{{ asset.temperature.toFixed(1) }}</td>
          <td [class]="'status ' + asset.status.toLowerCase()">{{ asset.status }}</td>
        </tr>
      } @empty {
        <tr><td colspan="3">No assets yet</td></tr>
      }
    </tbody>
  </table>
</aside>

<footer class="timeline" [class.past]="!isLive()">
  @if (range(); as r) {
    <button type="button" (click)="togglePlay()" [disabled]="isLive()">
      {{ playing() ? 'Pause' : 'Play' }}
    </button>
    <select (change)="onSpeedChange($event)" title="Playback speed">
      @for (s of playbackSpeeds; track s) {
        <option [value]="s" [selected]="s === speed()">{{ s }}×</option>
      }
    </select>
    <input
      type="range"
      [min]="r.earliest"
      [max]="r.latest"
      step="any"
      [value]="sliderValue()"
      (input)="onScrub($event)"
      aria-label="Time"
    />
    <span class="time-label">{{ timeLabel() }}</span>
    <button type="button" (click)="goLive()" [disabled]="isLive()">Live</button>
  } @else {
    <span class="time-label">Loading history…</span>
  }
</footer>
