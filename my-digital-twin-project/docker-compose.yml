services:
  db:
    image: postgres:16-alpine
    container_name: twin-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitaltwin}
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs only on first start, when the data volume is empty
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: twin-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-digitaltwin}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-twin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-twin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: twin-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db-data:
